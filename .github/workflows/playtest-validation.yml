name: QUAHOG Playtest Validation

on:
  push:
    branches: [feat/photorealism-mobile-phase1]
  pull_request:
    branches: [main, fix/2026-11-02-playtest-navigation-qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playtest-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test
