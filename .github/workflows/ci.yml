name: CI

# Gates only — this workflow NEVER deploys. Production deploys stay manual
# (backup -> rsync --exclude music -> verify) per SETUP.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the local build environment (node 24). If the local
          # toolchain moves, update this in the same change as the lockfile.
          node-version: "24"
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Gate 1 — tsc
        run: npx tsc --noEmit

      - name: Gate 2 — vitest
        run: npm run test

      - name: Gate 3 — blizzard
        run: npm run test:blizzard

      - name: Gate 4 — vite build
        run: npm run build

      - name: Gate 5 — music guard (no music/audio in the repo, ever)
        run: bash scripts/check-no-music.sh

      - name: Upload build artifact (main only, 7 days)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
